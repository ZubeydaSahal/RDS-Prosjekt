
name: Build Windows Application

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rds-app/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          architecture: x64
          cache: maven
          cache-dependency-path: rds-backend/pom.xml

      - name: Build React
        working-directory: rds-app
        run: |
          npm ci
          npm run build

      - name: Copy React into Spring Boot
        shell: pwsh
        run: |
          $static = "rds-backend/src/main/resources/static"

          if (Test-Path $static) {
            Remove-Item $static -Recurse -Force
          }

          New-Item -ItemType Directory -Path $static -Force | Out-Null
          Copy-Item "rds-app/dist/*" $static -Recurse -Force

          if (!(Test-Path "$static/index.html")) {
            throw "React build missing index.html"
          }

      - name: Build Spring Boot JAR
        working-directory: rds-backend
        shell: pwsh
        run: |
          .\mvnw.cmd -B clean package

      - name: Create Windows package
        shell: pwsh
        run: |
          $package = "output/RDS-PlayGround"

          New-Item -ItemType Directory -Path $package -Force | Out-Null

          $jar = Get-ChildItem "rds-backend/target/*.jar" |
            Where-Object { $_.Name -notlike "*.original" } |
            Select-Object -First 1

          if (!$jar) {
            throw "Spring Boot JAR not found"
          }

          Copy-Item $jar.FullName "$package/backend.jar"
          Copy-Item "packaging/start.bat" "$package/start.bat"

          jlink `
            --add-modules ALL-MODULE-PATH `
            --output "$package/runtime"

          if ($LASTEXITCODE -ne 0) {
            throw "jlink failed"
          }

          if (!(Test-Path "$package/runtime/bin/java.exe")) {
            throw "java.exe is missing from runtime"
          }

          & "$package/runtime/bin/java.exe" -version

          if ($LASTEXITCODE -ne 0) {
            throw "Bundled Java could not start"
          }

          Write-Host "Windows package created successfully"

      

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "output/RDS-PlayGround" `
            -DestinationPath "RDS-PlayGround-Windows-x64.zip"

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: RDS-PlayGround-Windows-x64
          path: RDS-PlayGround-Windows-x64.zip
          retention-days: 14
